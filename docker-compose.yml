services:
  # Development: API only
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: quel-io-dev:latest
    container_name: quelio-dev-api
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - kelio_data:/tmp
    restart: unless-stopped
    profiles: ["dev"]

  # Production: Full app
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: quel-io:latest
    container_name: quelio-prod
    ports:
      - "9876:80"
    volumes:
      - kelio_data:/tmp
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  kelio_data:
    driver: local