
<!DOCTYPE html>
<html lang="fr" class="overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Quel io ?</title>
    <script src="./assets/lib/vue.global.min.js"></script>
    <script src="./assets/lib/moment.min.js"></script>
    <script src="./assets/lib/fr.js"></script>
    <link href="./assets/lib/tailwind.min.css" rel="stylesheet">
    <link href="./assets/main.css" rel="stylesheet">
    <link href="./assets/scrollbar.css" rel="stylesheet">
</head>

<body class="text-white overflow-hidden" style="max-height: 100vh;">
    <div id="app">
        <!-- Loader -->
        <div v-if="loading" class="loader">
            <div class="loader-circle"></div>
        </div>

        <!-- Login Screen -->
        <div v-if="!isAuthenticated && !loading" class="min-h-screen flex items-center justify-center p-6">
            <div class="w-full max-w-md space-y-8 fade-in-up">
                <!-- Logo/Title -->
                <div class="text-center">
                    <h1 class="text-4xl font-bold mb-2">Quel io ?</h1>
                    <p class="text-indigo-300">Suivez vos horaires, tout simplement</p>
                </div>

                <!-- Login Form -->
                <div class="glass rounded-2xl p-8 space-y-6 text-black">
                    <form @submit.prevent="login" class="space-y-6">
                        <div class="space-y-2">
                            <label class="block text-sm text-indigo-300">Nom d'utilisateur</label>
                            <input type="text" v-model="credentials.username"
                                class="glass-input w-full px-4 py-3 rounded-xl" :class="{'border-red-500': error}"
                                placeholder="Votre nom d'utilisateur">
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm text-indigo-300">Mot de passe</label>
                            <input type="password" v-model="credentials.password"
                                class="glass-input w-full px-4 py-3 rounded-xl" :class="{'border-red-500': error}"
                                placeholder="Votre mot de passe">
                        </div>

                        <div v-if="error" class="text-red-400 text-sm text-center">
                            {{ error }}
                        </div>

                        <button type="submit" class="shine-btn w-full py-3 px-4 rounded-xl text-white font-medium"
                            :disabled="loading">
                            <span v-if="!loading">Se connecter</span>
                            <span v-else>Connexion...</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <template v-if="isAuthenticated && !loading">
            <!-- Offline banner -->
            <div v-if="offline" class="fixed top-0 inset-x-0 z-50">
                <div class="bg-amber-500/20 backdrop-blur border-b border-amber-500/40 text-amber-200 text-sm">
                    <div class="max-w-md mx-auto px-4 py-2 flex items-center gap-2">
                        <!-- Warning icon -->
                        <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                            <path fill="currentColor" d="M256 32c-17.7 0-33.9 9.5-42.7 24.9L9.4 438.6C.3 454.4 0 473 8.7 489.1S33.2 512 51.4 512H460.6c18.2 0 34.8-9.9 42.7-25.9s7.5-35.1-1.6-50.9L298.7 56.9C289.9 41.5 273.7 32 256 32zM280 392c0 13.3-10.7 24-24 24s-24-10.7-24-24s10.7-24 24-24s24 10.7 24 24zm-8-200l-8 136c-.6 10.5-9.3 18.7-19.8 18.1s-18.7-9.3-18.1-19.8l8-136c.6-10.5 9.3-18.7 19.8-18.1s18.7 9.3 18.1 19.8z"/>
                        </svg>
                        <span>
                            Impossible de récupérer les informations de <strong>Kelio</strong>.
                            Les données affichées sont celles sauvegardées lors de la dernière ouverture de l’app.
                        </span>
                    </div>
                </div>
            </div>

            <div class="space-y-8 overflow-hidden flex flex-col items-center" :class="offline ? 'pt-24' : ''" style="max-height: 100dwh;">
                <!-- Header Stats -->
                 <div id="statsContainerRef" class="overflow-hidden rounded-2xl w-full" style="min-height: 84px;">
                    <div class="px-6">
                        <div id="statsRef" class="stats-card glass p-6 space-y-6 rounded-2xl max-w-md w-full mx-auto">
                            <div class="flex justify-between items-center">
                                <h1 class="text-2xl font-bold tracking-tight flex justify-center">
                                    <span>Ma semaine</span>
                                    <div class="w-6 h-6 p-1 ml-2 cursor-pointer" style="margin-top: 5px;" @click="autoLogin">
                                        <!-- Refresh icon --><svg title="Actualiser vos horaires"
                                            class="text-indigo-300 w-full h-full" xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                            <path fill="currentColor"

                                        </svg>
                                    </div>
                                </h1>
                                <div @click="toggleBottomModal" class="w-6 h-6 p-1 cursor-pointer">
                                    <!-- Gear icon --><svg title="Réglages" class="text-indigo-300 w-full h-full"
                                        xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                        <path fill="currentColor"
                                            d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z" />
                                    </svg>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="flex flex-col items-center">
                                    <div class="text-indigo-300 text-sm mb-1">Total effectif</div>
                                    <div class="text-2xl font-bold">{{ data.total_effective }}</div>
                                </div>
                                <div class="flex flex-col items-center">
                                    <div class="text-indigo-300 text-sm mb-1">Temps restant</div>
                                    <div class="text-2xl font-bold"
                                        :class="remainingMinutes > 0 ? 'text-red-300' : 'text-green-300'">{{
                                        this.minutesToTime(remainingMinutes) }}</div>
                                </div>
                                <div class="flex flex-col items-center">
                                    <div class="text-indigo-300 text-sm mb-1">Total payé</div>
                                    <div class="text-2xl font-bold">{{ data.total_paid }}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>

                <!-- Days -->
                <div id="daysContainerRef" class="space-y-6 pb-40 h-full overflow-y-auto hide-scrollbar w-full" style="max-height: calc(100dvh - 234px)">
                    <div v-for="(times, date, index) in days" :key="date" class="px-6">
                        <div
                            class="day-card glass rounded-2xl overflow-hidden w-full max-w-md mx-auto"
                            :class="{ 'day-card-half-opacity': isDayCardHalfTransparent(times, date) }"
                            :style="{ animationDelay: index * 0.1 + 's',
                             opacity: !isDayCardHalfTransparent(times, date) && isDayCardTransparent(times, date) ? '0.3 !important' : 1 }">
    
                            <div @click="!!times && showMore($event)" class="p-6">
                                <!-- Date Header -->
                                <div class="flex justify-between"
                                    :class="{'mb-6': isDayCardHalfTransparent(times, date) || !isDayCardTransparent(times, date)}">
                                    <div>
                                        <div class="flex">
                                            <div v-if="/*!isPastDateOrWeekend(date)*/true"
                                                @click="missingDates.map((md) => md.split(' [-] ')[0]).includes(date) ? removeAbsent(date) : (() => { presenceDate = date; togglePresenceModal(); })()"
                                                style="margin-top: 2px;"
                                                class="w-6 h-6 p-1 mr-2">
                                                <!-- Absent icon --><svg title="Marquer ce jour comme non travaillé"
                                                    v-if="missingDates.map((md) => md.split(' [-] ')[0]).includes(date)"
                                                    class="text-red-300 h-full w-full" xmlns="http://www.w3.org/2000/svg"
                                                    viewBox="0 0 640 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                                    <path fill="currentColor"
                                                        d="M96 128a128 128 0 1 1 256 0A128 128 0 1 1 96 128zM0 482.3C0 383.8 79.8 304 178.3 304l91.4 0C368.2 304 448 383.8 448 482.3c0 16.4-13.3 29.7-29.7 29.7L29.7 512C13.3 512 0 498.7 0 482.3zM471 143c9.4-9.4 24.6-9.4 33.9 0l47 47 47-47c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-47 47 47 47c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-47-47-47 47c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l47-47-47-47c-9.4-9.4-9.4-24.6 0-33.9z" />
                                                </svg>
                                                <!-- Present icon --><svg title="Marquer ce jour comme travaillé" v-else
                                                    xmlns="http://www.w3.org/2000/svg" class="text-indigo-300 h-full w-full"
                                                    viewBox="0 0 640 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                                    <path fill="currentColor"
                                                        d="M96 128a128 128 0 1 1 256 0A128 128 0 1 1 96 128zM0 482.3C0 383.8 79.8 304 178.3 304l91.4 0C368.2 304 448 383.8 448 482.3c0 16.4-13.3 29.7-29.7 29.7L29.7 512C13.3 512 0 498.7 0 482.3zM625 177L497 305c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L591 143c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z" />
                                                </svg>
                                            </div>
                                            <h2 class="text-xl font-semibold">{{ formatDate(date) }}</h2>
                                        </div>
                                        <div v-if="times" class="text-indigo-300 text-sm mt-1">
                                            {{ getDayTotal(times) }}
                                        </div>
                                    </div>
                                    <div v-if="times" class="w-6 h-6 p-1">
                                        <!-- Caret down icon --><svg title="Afficher plus d'informations"
                                            class="caret-icon text-white h-full w-full transition-transform duration-300"
                                            xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 320 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                            <path fill="currentColor"
                                                d="M31.3 192h257.3c17.8 0 26.7 21.5 14.1 34.1L174.1 354.8c-7.8 7.8-20.5 7.8-28.3 0L17.2 226.1C4.6 213.5 13.5 192 31.3 192z" />
                                        </svg>
                                    </div>
                                </div>
    
                                <!-- Timeline -->
                                <div v-if="isDayCardHalfTransparent(times, date) || !isDayCardTransparent(times, date)"
                                    class="relative">
                                    <div class="timeline-container relative">
                                        <template v-if="times">
                                            <div v-for="(block, idx) in getTimeBlocks(times)" :key="idx"
                                                class="time-block z-10 pointer-events-none" :style="getBlockStyle(block)">
                                            </div>
                                        </template>
                                        <template v-if="suggestedTimeBlocks">
                                            <div v-for="(block, idx) in suggestedTimeBlocks[date]" :key="idx"
                                                class="suggestedBlock border-2 absolute h-full transition-all duration-200 flex items-center rounded-md"
                                                :class="`${date}-${idx}` === selectedSuggestedBlock ? `selectedSuggestedBlock ${hasBeforeSelector(block, date)}` : 'opacity-20'"
                                                :style="getBlockStyle(block)"
                                                style="background: repeating-linear-gradient(110deg,#aaa, #aaa 2px, transparent 2px, transparent 6px); border-color: #aaa;"
                                                @click.stop="selectedSuggestedBlock = selectedSuggestedBlock === `${date}-${idx}` ? null : `${date}-${idx}`">
                                                <div v-if="`${date}-${idx}` === selectedSuggestedBlock && hasBeforeSelector(block, date)"
                                                    class="absolute -left-0.5 w-2 h-6 rounded-full bg-white"
                                                    @mousedown.stop="startResizeSuggestion($event, date, idx, 'start')">
                                                </div>
                                                <div v-if="`${date}-${idx}` === selectedSuggestedBlock"
                                                    class="absolute -right-0.5 w-2 h-6 rounded-full bg-white"
                                                    @mousedown.stop="startResizeSuggestion($event, date, idx, 'end')"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="time-labels">
                                        <span v-for="hour in 12" :key="hour" class="text-center"
                                            :class="{'opacity-0': ![8, 10, 12, 14, 16, 18].includes(hour + 7)}">{{ hour + 7
                                            }}</span>
                                    </div>
                                </div>
    
                                <!-- Time Blocks -->
                                <div class="time-blocks overflow-y-hidden transition-height" style="height: 0px;">
                                    <div v-if="times" class="space-y-1 pt-8">
                                        <div v-for="(block, idx) in getTimeBlocks(times)" :key="idx"
                                            class="flex items-center justify-between p-3 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                                            <div class="flex items-center space-x-3">
                                                <div
                                                    class="w-2 h-2 rounded-full bg-gradient-to-r from-indigo-500 to-indigo-600">
                                                </div>
                                                <span>{{ block.start }} <span class="text-sm">→</span> {{ block.end
                                                    }}</span>
                                            </div>
                                            <div class="text-indigo-300">{{ block.duration }}</div>
                                        </div>
                                    </div>
                                </div>
    
                            </div>
                        </div>
                    </div>
                </div>

                <!-- [DEBUG MODE] Console log viewver -->
                <div v-if="debugMode" id="debugDiv"
                    class="overflow-y-auto h-1/4 bg-gray-800 text-gray-200 font-mono text-sm p-2 fixed bottom-0 left-0 right-0 day-card glass rounded-2xl">
                    <div v-for="(log, index) in logs" :key="index" :class="{
                            'text-green-500': log.type === 'log',
                            'text-yellow-500': log.type === 'warn',
                            'text-red-500': log.type === 'error'
                        }">[{{ log.type.toUpperCase() }}] {{ log.message }}</div>
                </div>

                <!-- Settings modal -->
                <div id="bottom-modal" class="fixed inset-0 z-50 pointer-events-none transition-color duration-100"
                    @click.self="toggleBottomModal" style="background-color: rgba(0, 0, 0, 0);">
                    <div class="modal-content glass rounded-t-2xl absolute bottom-0 inset-x-0 p-6 flex items-center flex-col transition-transform duration-200 gap-5"
                        style="transform: translateY(100%);">
                        <h2 class="text-xl font-bold">Réglages</h2>
                        <!-- Logout icon --><svg title="Se déconnecter" @click="logout"
                            class="text-indigo-300 h-6 w-6 absolute top-6 right-6" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                            <path fill="currentColor"
                                d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z" />
                        </svg>
                        <div class="w-full flex flex-col items-stretch">
                            <label for="hour-objective" class="flex items-center justify-between pb-2"
                                style="border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                                Heures par semaine
                                <input type="number" id="hour-objective"
                                    class="glass-input w-12 px-2 py-1 rounded-xl text-center" placeholder="38?"
                                    :value="minutesObjective / 60" @input="changeHourObjective">
                            </label>
                            <label for="debug-mode" class="flex items-center justify-between pb-2"
                                style="border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                                Mode debug
                                <input type="checkbox" id="debug-mode" class="w-4 h-4 px-2 py-1 rounded-xl text-center"
                                    :checked="debugMode" @input="changeDebugMode">
                            </label>
                        </div>
                    </div>
                </div>

                <!-- mark absent modal -->
                <div id="presence-modal" class="fixed inset-0 z-50 pointer-events-none transition-color duration-100"
                    style="background-color: rgba(0, 0, 0, 0);" @click.self="togglePresenceModal">
                    <div class="modal-content glass rounded-t-2xl absolute bottom-0 inset-x-0 p-6 flex items-center flex-col transition-transform duration-200 gap-5"
                        style="transform: translateY(100%);">
                        <h2 class="text-xl font-bold">Absent le {{ presenceDate }} ?</h2>
                        <!-- choose between: whole day, evening or afternoon -->
                        <div class="w-full flex flex-col items-center justify-center gap-2">
                            <button @click="markAbsent(presenceDate, 'day')"
                                class="shine-btn w-2/3 py-3 px-4 rounded-xl text-white font-medium">Journée
                                entière</button>
                            <div class="flex w-2/3 gap-2">
                                <button @click="markAbsent(presenceDate, 'morning')"
                                    class="shine-btn w-1/2 py-3 px-4 rounded-xl text-white font-medium">Matin</button>
                                <button @click="markAbsent(presenceDate, 'afternoon')"
                                    class="shine-btn w-1/2 py-3 px-4 rounded-xl text-white font-medium">Après-midi</button>
                            </div>
                        </div>
                    </div>
                </div>
        </template>
    </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    isAuthenticated: false,
                    loading: true,
                    error: null,
                    credentials: {
                        username: '',
                        password: ''
                    },
                    offline: false,
                    missingDates: [],
                    customBornesForSuggestions: {},
                    selectedSuggestedBlock: null,
                    minutesObjective: 38 * 60,
                    nbDays: 5,
                    data: null,
                    presenceDate: null,

                    // Debug mode data
                    debugMode: false,
                    logs: [],
                    originalLog: null,
                    originalWarn: null,
                    originalError: null
                }
            },
            computed: {
                days() {
                    const days = {};
                    const today = new Date();
                    const todayObj = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                    if (this.data) {
                        for (const date of this.getCurrentWeekDates()) {
                            days[date] = this.data.hours[date];
                            const [day, month, year] = date.split('-').map(Number);
                            const dateObj = new Date(year, month - 1, day);
                            if (dateObj < todayObj && !this.missingDates.map((md) => md.split(' [-] ')[0]).includes(date) && !this.data.hours[date]) {
                                this.missingDates.push(date);
                                this.saveLocalStorage('missing_dates', this.missingDates);
                            }
                        }
                    }
                    return days;
                },
                remainingMinutes() {
                    return this.minutesObjective - this.timeToMinutes(this.data.total_paid) - this.nbMissingInCurrentWeek * this.minutesObjective / this.nbDays;
                },
                nbMissingInCurrentWeek() {
                    const fullMissingDates = this.missingDates.filter((md) => md.split(' [-] ').length === 1).filter(date => this.getCurrentWeekDates().includes(date.split(' [-] ')[0]))?.length ?? 0;
                    const halfMissingDates = (this.missingDates.filter((md) => md.split(' [-] ').length === 2).filter(date => this.getCurrentWeekDates().includes(date.split(' [-] ')[0]))?.length ?? 0) / 2;
                    return fullMissingDates + halfMissingDates;
                },

                daysLeft() {
                    const today = this.formatDataDate(new Date());
                    const todayMinutes = this.timeToMinutes(this.getDayTotal(this.days[today]));

                    const daysLeft = Object.keys(this.days)?.filter((date) => !this.isPastDateOrWeekend(date) && !this.missingDates.map((md) => md.split(' [-] ')[0]).includes(date));
                    if (!daysLeft) {
                        return null;
                    }
                    const followingDays = daysLeft.filter(date => date !== today);
                    if (followingDays.length === 0 && todayMinutes < this.remainingMinutes) {
                        return daysLeft;
                    }

                    if (todayMinutes >= this.remainingMinutes / followingDays.length) {
                        return followingDays;
                    }
                    return daysLeft;
                },

                maxTimeLeft() {
                    if (!this.daysLeft) {
                        return {};
                    }
                    const now = new Date();
                    const hourNow = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    const today = this.formatDataDate(now);

                    const result = this.daysLeft.reduce((acc, date) => {
                        const customBornes = this.withDefaultMaxBornes(this.customBornesForSuggestions[date])
                        if (date === today && this.days[date]) {
                            const hours = [...this.days[date]];
                            if (hours.length % 2) {
                                hours.push(hourNow);
                            }
                            const startHourAfterNow = this.suggestStartHour(date, hours);
                            hours.push(startHourAfterNow);
                            if (this.timeToMinutes(startHourAfterNow) < this.timeToMinutes(customBornes.endMorning)) {
                                hours.push(...[customBornes.endMorning, customBornes.startAfternoon]);
                            }
                            hours.push(this.minutesToTime(Math.min(this.timeToMinutes(startHourAfterNow) + this.remainingMinutes, this.timeToMinutes(customBornes.endAfternoon))));
                            return { ...acc, [date]: this.timeToMinutes(this.getDayTotal(hours)) };
                        }
                        return { ...acc, [date]: this.timeToMinutes(this.getDayTotal(Object.values(customBornes))) };
                    }, {});
                    return result;
                },
                minTimeLeft() {
                    if (!this.daysLeft) {
                        return {};
                    }
                    const now = new Date();
                    const hourNow = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    const today = this.formatDataDate(now);

                    const result = this.daysLeft.reduce((acc, date) => {
                        const customBornes = this.withDefaultMinBornes(this.customBornesForSuggestions[date])
                        if (date === today && this.days[date]) {
                            const hours = [...this.days[date]];
                            if (hours.length % 2) {
                                hours.push(hourNow);
                            }
                            const startHourAfterNow = this.suggestStartHour(date, hours);
                            hours.push(startHourAfterNow);
                            if (this.timeToMinutes(startHourAfterNow) < this.timeToMinutes(customBornes.endMorning)) {
                                hours.push(...[customBornes.endMorning, customBornes.startAfternoon]);
                            }
                            hours.push(this.minutesToTime(Math.min(this.timeToMinutes(startHourAfterNow) + this.remainingMinutes, this.timeToMinutes(customBornes.startAfternoon))));
                            return { ...acc, [date]: this.timeToMinutes(this.getDayTotal(hours)) };
                        }
                        return { ...acc, [date]: this.timeToMinutes(this.getDayTotal(Object.values(customBornes))) };
                    }, {});
                    return result;
                },


                suggestedTimeBlocks() {
                    const fridayMaxEndDay = this.timeToMinutes('17:30');
                    const lunchBreakDuration = 60;

                    const now = new Date();
                    const today = this.formatDataDate(now);
                    const timeNow = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    const minutesNow = this.timeToMinutes(timeNow);
                    const todayHours = this.days[today];
                    const todayMinutes = this.timeToMinutes(this.getDayTotal(todayHours));

                    if (!this.daysLeft) {
                        return {};
                    }

                    const timeLeftByDayWithoutToday = this.remainingMinutes / (this.daysLeft.filter(date => date !== today).length || 1);
                    let timeLeftByDay = (this.remainingMinutes + (todayMinutes >= timeLeftByDayWithoutToday ? 0 : todayMinutes)) / this.daysLeft.length;

                    const timeLeftwithCustomBornes = this.getTimeLeftwithCustomBornesConstraints(timeLeftByDay);

                    const result = Object.keys(this.days).reduce((acc, date) => {
                        if (!this.daysLeft.includes(date)) {
                            return { ...acc, [date]: [] };
                        }
                        const maxEndLunch = this.timeToMinutes(this.customBornesForSuggestions[date]?.startAfternoon ?? '14:00');
                        const minStartDay = this.timeToMinutes(this.customBornesForSuggestions[date]?.startMorning ?? '08:30');
                        const maxStartDay = this.timeToMinutes(this.customBornesForSuggestions[date]?.startMorning ?? '09:00');
                        const maxEndDay = this.timeToMinutes(this.customBornesForSuggestions[date]?.endAfternoon ?? '18:30');
                        const minEndDay = this.timeToMinutes(this.customBornesForSuggestions[date]?.endAfternoon ?? '16:30');
                        const minStartLunch = this.timeToMinutes(this.customBornesForSuggestions[date]?.endMorning ?? '12:00');
                        let minEndLunch = Math.max(minStartLunch + lunchBreakDuration, this.timeToMinutes(this.customBornesForSuggestions[date]?.startAfternoon ?? '13:00'));
                        const hours = this.days[date] ?? [];
                        const totalMinutes = this.timeToMinutes(this.getDayTotal(hours));

                        const timeLeft = date === today ? timeLeftwithCustomBornes[date] - totalMinutes : timeLeftwithCustomBornes[date];
                        const betweenLunchBreak = minStartLunch < minutesNow && minutesNow < maxEndLunch;
                        const withLunchTime = date !== today || !this.hasAlreadyLunchBreak(hours) && betweenLunchBreak;
                        let start = date === today ? (hours.length % 2 ? this.timeToMinutes(hours[hours.length - 1]) : withLunchTime ? Math.max(this.timeToMinutes(hours[hours.length - 1]) + lunchBreakDuration, minutesNow) : minutesNow) : minStartDay;
                        let end = Math.min(start + timeLeft + (withLunchTime ? lunchBreakDuration : 0), maxEndDay);
                        const differenceWithMinEnd = end - minEndDay;
                        if (differenceWithMinEnd < 0) {
                            end = minEndDay;
                            if (date !== today || !hours.length) {
                                start = Math.min(start - differenceWithMinEnd, maxStartDay);
                                minEndLunch = Math.min(minEndLunch + Math.max(-differenceWithMinEnd - (maxStartDay - minStartDay), 0), maxEndLunch);
                            } else if (start < maxEndLunch && start > minStartLunch) {
                                const endLunch = Math.max(Math.min(minEndLunch + differenceWithMinEnd, maxEndLunch), start);
                                if (withLunchTime && hours.length % 2 === 0) {
                                    minEndLunch = endLunch;
                                } else {
                                    start = endLunch;
                                }
                            }
                        }
                        const suggestHours = (start < minStartLunch ? [start, minStartLunch, minEndLunch, end] : [start, end]).map(this.minutesToTime);
                        return { ...acc, [date]: this.getTimeBlocks(suggestHours) };
                    }, {});
                    return result;
                },
            },
            methods: {
                async login() {
                    this.loading = true;
                    this.error = null;

                    try {
                        const formData = new FormData();
                        formData.append('username', this.credentials.username);
                        formData.append('password', this.credentials.password);

                        const response = await fetch('./api/', {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error('Identifiants invalides');
                        }

                        const data = await response.json();

                        if (data.error) {
                            if (data.error.includes('using cached data')) {
                                this.offline = true;
                            } else {
                                throw new Error(data.error);
                            }
                        }

                        this.data = data;
                        this.isAuthenticated = true;

                        // Sauvegarder les credentials dans les cookies
                        this.saveCredentials();
                    } catch (err) {
                        this.error = "Erreur de connexion. Vérifiez vos identifiants.";
                        console.error('Erreur:', err);
                    } finally {
                        this.loading = false;
                    }
                },
                logout() {
                    this.isAuthenticated = false;
                    this.data = null;
                    this.clearCredentials();
                },
                saveCredentials() {
                    const credentials = btoa(JSON.stringify(this.credentials));
                    document.cookie = `quelio_credentials=${credentials}; max-age=2592000; path=/; Secure; SameSite=Strict`;
                },
                clearCredentials() {
                    document.cookie = 'quelio_credentials=; max-age=0; path=/;';
                },
                loadCredentials() {
                    const cookies = document.cookie.split(';');
                    const credentialCookie = cookies.find(cookie => cookie.trim().startsWith('quelio_credentials='));

                    if (credentialCookie) {
                        try {
                            const encodedCredentials = credentialCookie.split('=')[1];
                            const credentials = JSON.parse(atob(encodedCredentials));
                            this.credentials = credentials;
                            return true;
                        } catch (err) {
                            console.error('Erreur lors du chargement des credentials:', err);
                            return false;
                        }
                    }
                    return false;
                },
                saveLocalStorage(label, data) {
                    localStorage.setItem(`quelio_${label}_${this.credentials.username}`, JSON.stringify(data));
                },
                loadLocalStorage(label) {
                    const data = localStorage.getItem(`quelio_${label}_${this.credentials.username}`);
                    return data ? JSON.parse(data) : null;
                },
                async autoLogin() {
                    if (this.loadCredentials()) {
                        await this.login();
                    } else {
                        this.loading = false;
                    }
                },
                isDayCardTransparent(times, date) {
                    return !times && this.isPastDateOrWeekend(date) || this.missingDates.map((md) => md.split(' [-] ')[0]).includes(date);
                },
                isDayCardHalfTransparent(times, date) {
                    return this.missingDates.filter((md) => md.split(' [-] ').length === 2).map((md) => md.split(' [-] ')[0]).includes(date);
                },
                startResizeSuggestion(event, date, idx, handle) {
                    const block = this.suggestedTimeBlocks[date][idx];
                    const initBlockHandle = block[handle];
                    const startX = event.clientX;
                    const timeLineSize = event.target.closest('.timeline-container').clientWidth;
                    const timeLineDuration = this.timeToMinutes('19:00') - this.timeToMinutes('08:00');
                    const { typeHandler, minPosition, maxPosition } = this.getBornesTime(date, this.timeToMinutes(initBlockHandle))

                    const onMouseMove = (e) => {
                        const dx = e.clientX - startX;
                        const diffMinutes = (dx / timeLineSize) * timeLineDuration;
                        block[handle] = this.minutesToTime(Math.min(Math.max(minPosition, this.timeToMinutes(initBlockHandle) + diffMinutes), maxPosition));
                        this.saveNewSuggestionBorne(date, block[handle], typeHandler);
                    };

                    const onMouseUp = () => {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                },
                getBornesTime(date, time) {
                    const isToday = date === this.formatDataDate(new Date());
                    const minutesNow = this.timeToMinutes((new Date()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
                    const lastHour = this.days[date]?.length ? this.days[date].length % 2 ? minutesNow : this.timeToMinutes(this.days[date][this.days[date].length - 1]) : 0;
                    if (time >= this.timeToMinutes('08:30') && time <= this.timeToMinutes('9:00')) {
                        return {
                            typeHandler: 'startMorning',
                            minPosition: this.timeToMinutes('08:30'),
                            maxPosition: this.timeToMinutes('09:00')
                        };
                    }
                    if (time >= Math.max(this.timeToMinutes('12:00'), lastHour) && time <= this.timeToMinutes('13:00')) {
                        return {
                            typeHandler: 'endMorning',
                            minPosition: Math.max(this.timeToMinutes('12:00'), lastHour),
                            maxPosition: this.timeToMinutes('13:00')
                        }
                    }
                    if (time >= this.timeToMinutes('13:00') && time <= this.timeToMinutes('14:00')) {
                        return {
                            typeHandler: 'startAfternoon',
                            minPosition: this.timeToMinutes('13:00'),
                            maxPosition: this.timeToMinutes('14:00')
                        }
                    }
                    if (time >= Math.max(this.timeToMinutes('16:30'), lastHour) && time <= this.timeToMinutes('18:30')) {
                        return {
                            typeHandler: 'endAfternoon',
                            minPosition: Math.max(this.timeToMinutes('16:30'), lastHour),
                            maxPosition: this.timeToMinutes('18:30')
                        }
                    }
                    return {
                        typeHandler: undefined,
                        minPosition: time,
                        maxPosition: time
                    }
                },
                formatDataDate(date) {
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = date.getFullYear();
                    return `${day}-${month}-${year}`;
                },
                getCurrentWeekDates() {
                    const today = new Date();
                    const dayOfWeek = today.getDay();
                    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;

                    const monday = new Date(today);
                    monday.setDate(today.getDate() + mondayOffset);
                    const weekDates = [];
                    for (let i = 0; i < 7; i++) {
                        const currentDay = new Date(monday);
                        currentDay.setDate(monday.getDate() + i);
                        weekDates.push(this.formatDataDate(currentDay));
                    }
                    return weekDates;
                },
                isPastDateOrWeekend(date) {
                    const today = new Date();
                    const todayObj = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                    const [day, month, year] = date.split('-').map(Number);
                    const dateObj = new Date(year, month - 1, day);
                    return dateObj < todayObj || dateObj.getDay() === 0 || dateObj.getDay() === 6;
                },
                timeToMinutes(time) {
                    const [hours, minutes] = time.split(':').map(Number);
                    return hours * 60 + minutes;
                },
                minutesToTime(minutes) {
                    minutes = Math.ceil(minutes);
                    const hours = Math.floor(minutes / 60);
                    const mins = minutes % 60;
                    return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                },
                hasAlreadyLunchBreak(hours) {
                    // Check if hours already contains a lunch break (1h or more between 12:00 and 14:00)
                    for (let i = 0; i < hours.length; i += 2) {
                        const start = this.timeToMinutes(hours[i]);
                        const end = this.timeToMinutes(hours[i + 1] ?? (new Date()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
                        return start <= this.timeToMinutes('14:00') && end >= this.timeToMinutes('12:00') && end - start >= 60;
                    }
                },
                getTimeBlocks(times) {
                    const blocks = [];
                    for (let i = 0; i < times.length; i += 2) {
                        if (times[i]) {
                            const end = times[i + 1] ?? (new Date()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                            blocks.push({
                                start: times[i],
                                end,
                                duration: this.calculateDuration(times[i], end)
                            });
                        }
                    }
                    return blocks;
                },
                getBlockStyle(block) {
                    const offset = this.timeToMinutes('08:00');

                    const startMinutes = this.timeToMinutes(block.start) - offset;
                    const endMinutes = this.timeToMinutes(block.end) - offset;
                    const totalMinutes = this.timeToMinutes('19:00') - offset;

                    const borneStart = this.timeToMinutes('08:30') - offset;
                    const borneEnd = this.timeToMinutes('18:30') - offset;

                    const effectiveStart = Math.max(borneStart, Math.min(startMinutes, borneEnd));
                    const effectiveEnd = Math.max(borneStart, Math.min(endMinutes, borneEnd));

                    const startPercent = (effectiveStart / totalMinutes) * 100;
                    const widthPercent = ((effectiveEnd - effectiveStart) / totalMinutes) * 100;

                    const realStartPercent = (startMinutes / totalMinutes) * 100;
                    const realWidthPercent = ((endMinutes - startMinutes) / totalMinutes) * 100;

                    return {
                        left: `${realStartPercent}%`,
                        width: `${realWidthPercent}%`,
                    };
                },
                hasBeforeSelector(block, date) {
                    return !this.days[date] || this.days[date].length % 2 === 0 || this.timeToMinutes(block.start) > this.timeToMinutes(new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })) ? 'beforeSelector' : false;
                },
                calculateDuration(start, end) {
                    const startMinutes = this.timeToMinutes(start);
                    const endMinutes = this.timeToMinutes(end);
                    const duration = endMinutes - startMinutes;
                    const hours = Math.floor(duration / 60);
                    const minutes = duration % 60;
                    return `${hours}h${minutes.toString().padStart(2, '0')}`;
                },
                formatDate(date) {
                    moment.locale('fr');
                    return moment(date, 'DD-MM-YYYY').format('dddd D MMMM');
                },
                getDayTotal(times) {
                    let total = 0;
                    for (let i = 0; i < times.length; i += 2) {
                        const duration = Math.max(this.timeToMinutes('08:30'), Math.min(this.timeToMinutes(times[i + 1] ?? (new Date()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })), this.timeToMinutes('18:30')))
                            - Math.max(this.timeToMinutes('08:30'), Math.min(this.timeToMinutes(times[i]), this.timeToMinutes('18:30')));
                        total += duration;
                    }
                    const hours = Math.floor(total / 60);
                    const minutes = total % 60;
                    return this.minutesToTime(total);
                },
                markAbsent(date, section = 'day') {
                    // section: day | morning | afternoon
                    let missingDates = this.loadLocalStorage('missing_dates') ?? [];
                    missingDates = missingDates.filter(d => {
                        const [day, month, year] = date.split('-').map(Number);
                        const dateObj = new Date(year, month - 1, day);
                        return dateObj > new Date()
                    });
                    missingDates.push(section === 'day' ? date : `${date} [-] ${section}`);
                    this.saveLocalStorage('missing_dates', missingDates);
                    this.missingDates = missingDates;
                    this.togglePresenceModal();
                },
                removeAbsent(date) {
                    let missingDates = this.loadLocalStorage('missing_dates') ?? [];
                    missingDates = missingDates.filter(d => d.split(' [-] ')[0] !== date);
                    this.saveLocalStorage('missing_dates', missingDates);
                    this.missingDates = missingDates;
                },

                saveNewSuggestionBorne(date, time, section) {
                    this.customBornesForSuggestions = {
                        ...this.customBornesForSuggestions,
                        [date]: this.customBornesForSuggestions[date] ? { ...this.customBornesForSuggestions[date], [section]: time } : { [section]: time }
                    };
                    this.saveLocalStorage('custom_bornes_for_suggestions', this.customBornesForSuggestions);
                },

                getCustomBorneForSuggestions() {
                    const customBornes = this.loadLocalStorage('custom_bornes_for_suggestions') ?? {};
                    for (const [date, value] of Object.entries(customBornes)) {
                        if (!this.getCurrentWeekDates().includes(date)) {
                            delete customBornes[date];
                        }
                    }
                    this.customBornesForSuggestions = customBornes;
                    this.saveLocalStorage('custom_bornes_for_suggestions', customBornes);
                },

                withDefaultMaxBornes(customBornesDate) {
                    return {
                        startMorning: customBornesDate?.startMorning ?? '08:30',
                        endMorning: customBornesDate?.endMorning ?? '12:00',
                        startAfternoon: customBornesDate?.startAfternoon ?? '13:00',
                        endAfternoon: customBornesDate?.endAfternoon ?? '18:30',
                    }
                },
                withDefaultMinBornes(customBornesDate) {
                    return {
                        startMorning: customBornesDate?.startMorning ?? '09:00',
                        endMorning: customBornesDate?.endMorning ?? '12:00',
                        startAfternoon: customBornesDate?.startAfternoon ?? '14:00',
                        endAfternoon: customBornesDate?.endAfternoon ?? '16:30',
                    }
                },
                suggestStartHour(date, hours = []) {
                    const customBornes = this.withDefaultMaxBornes(this.customBornesForSuggestions[date]);
                    if (hours.length === 0) {
                        return customBornes.startMorning;
                    }

                    const hourNow = (new Date()).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                    const lastHour = hours.length % 2 ? hourNow : hours[hours.length - 1];
                    if (this.timeToMinutes(hourNow) <= this.timeToMinutes(customBornes.endMorning)) {
                        return hourNow;
                    } else if (this.timeToMinutes(hourNow) <= this.timeToMinutes(customBornes.startAfternoon)) {
                        if (hours.length % 2 && this.timeToMinutes(hourNow) >= this.timeToMinutes('13:00')) {
                            return hourNow;
                        }
                        return this.minutesToTime(Math.max(this.timeToMinutes(customBornes.startAfternoon), Math.min(this.timeToMinutes(lastHour) + 60, this.timeToMinutes('14:00'))));
                    } else {
                        return this.minutesToTime(Math.min(this.timeToMinutes(customBornes.endAfternoon), this.timeToMinutes(hourNow)));
                    }
                },
                getTimeLeftwithCustomBornesConstraints(timeLeft) {
                    let totalOverTime = 0;
                    let totalLowerTime = 0;
                    let timeLeftByDay = this.daysLeft.reduce((acc, date) => ({
                        ...acc,
                        [date]: timeLeft
                    }), {});
                    let overTimeDays = [];
                    let lowerTimeDays = [];
                    let index = 0;
                    do {
                        timeLeftByDay = this.daysLeft.reduce((acc, date) => ({
                            ...acc,
                            [date]: overTimeDays.includes(date) ? this.maxTimeLeft[date] : lowerTimeDays.includes(date) ? this.minTimeLeft[date] : timeLeftByDay[date] + totalOverTime - totalLowerTime / (this.daysLeft.length - overTimeDays.length)
                        }), {});
                        totalOverTime = 0;
                        overTimeDays = this.daysLeft.reduce((acc, date) => {
                            if (timeLeftByDay[date] > this.maxTimeLeft[date]) {
                                totalOverTime += timeLeftByDay[date] - this.maxTimeLeft[date];
                                return [...acc, date];
                            }
                            if (timeLeftByDay[date] < this.minTimeLeft[date]) {
                                totalLowerTime += this.minTimeLeft[date] - timeLeftByDay[date];
                                return [...acc, date];
                            }
                            return acc;
                        }, []);
                        index++;
                    } while ((totalOverTime > 0 || totalLowerTime > 0) && index < 10 && this.daysLeft.length !== overTimeDays.length);
                    return this.daysLeft.reduce((acc, date) => ({
                        ...acc,
                        [date]: Math.min(Math.max(timeLeftByDay[date], this.minTimeLeft[date]), this.maxTimeLeft[date])
                    }), {});
                },
                showMore(event) {
                    const parent = event.target.closest('.day-card');
                    const content = parent.querySelector('.time-blocks');

                    if (content.style.height === '0px') {
                        parent.querySelector('.caret-icon').style.transform = 'rotate(180deg)';
                        content.style.height = content.scrollHeight + 'px';
                    } else {
                        parent.querySelector('.caret-icon').style.transform = 'rotate(0deg)';
                        content.style.height = '0px';
                    }
                },
                toggleBottomModal() {
                    const modal = document.getElementById('bottom-modal');
                    modal.classList.toggle('pointer-events-none');
                    modal.style.backgroundColor = modal.style.backgroundColor === 'rgba(0, 0, 0, 0.5)' ? 'rgba(0, 0, 0, 0)' : 'rgba(0, 0, 0, 0.5)';
                    modal.style.margin = modal.style.margin === '0' ? '' : '0';
                    modal.querySelector('.modal-content').style.transform = modal.querySelector('.modal-content').style.transform === 'translateY(0%)' ? 'translateY(100%)' : 'translateY(0%)';
                },
                togglePresenceModal() {
                    const modal = document.getElementById('presence-modal');
                    modal.classList.toggle('pointer-events-none');
                    modal.style.backgroundColor = modal.style.backgroundColor === 'rgba(0, 0, 0, 0.5)' ? 'rgba(0, 0, 0, 0)' : 'rgba(0, 0, 0, 0.5)';
                    modal.style.margin = modal.style.margin === '0' ? '' : '0';
                    modal.querySelector('.modal-content').style.transform = modal.querySelector('.modal-content').style.transform === 'translateY(0%)' ? 'translateY(100%)' : 'translateY(0%)';
                },
                changeHourObjective(event) {
                    this.minutesObjective = event.target.value * 60;
                    this.saveLocalStorage('hour_objective', this.minutesObjective);
                },
                changeDebugMode(event) {
                    this.debugMode = event.target.checked;
                    this.saveLocalStorage('debug_mode', this.debugMode);
                },
                addLog(type, args) {
                    const message = args.map(arg => {
                        try {
                            return typeof arg === "object" ? JSON.stringify(arg) : String(arg);
                        } catch (e) {
                            return String(arg);
                        }
                    }).join(" ");

                    this.logs.push({ type, message });

                    const debugDiv = document.getElementById('debugDiv');
                    if (debugDiv) {
                        debugDiv.scrollTop = debugDiv.scrollHeight;
                    }
                },
                waitForElement(selector, callback) {
                    const interval = setInterval(() => {
                      const element = document.querySelector(selector);
                      if (element) {
                        clearInterval(interval);
                        callback(element);
                      }
                    }, 100);
                  }  
            },
            mounted() {
                this.autoLogin();
                this.getCustomBorneForSuggestions();
                this.missingDates = this.loadLocalStorage('missing_dates') ?? [];
                this.minutesObjective = Number(this.loadLocalStorage('hour_objective')) || 38 * 60;
                this.debugMode = this.loadLocalStorage('debug_mode') ?? false;
                document.addEventListener('click', (event) => {
                    if (this.selectedSuggestedBlock && !event.target.closest('.suggestedBlock')) {
                        this.selectedSuggestedBlock = null;
                    }
                });
                this.waitForElement('#daysContainerRef', (e) => {
                    e.addEventListener('scroll', (ev) => {
                        const statsRef = document.getElementById('statsRef');
                        if (statsRef) {
                            statsRef.style.setProperty('margin-bottom', `${-1 * (ev.target.scrollTop)}px`);
                        }
                    });
                });
            },
            created() {
                this.originalLog = console.log;
                this.originalWarn = console.warn;
                this.originalError = console.error;

                console.log = (...args) => {
                    this.addLog("log", args);
                    this.originalLog.apply(console, args);
                };

                console.warn = (...args) => {
                    this.addLog("warn", args);
                    this.originalWarn.apply(console, args);
                };

                console.error = (...args) => {
                    this.addLog("error", args);
                    this.originalError.apply(console, args);
                };
            },
            beforeDestroy() {
                console.log = this.originalLog;
                console.warn = this.originalWarn;
                console.error = this.originalError;
            }
        }).mount('#app')
    </script>
</body>

</html>
